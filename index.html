<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme === '"dark"') {
        document.documentElement.classList.add("dark");
      }
    </script>
    <link rel="stylesheet" href="./css/base.css" />
    <title>Home</title>
    <link rel="icon" type="image/x-icon" href="././assets/logo-icon.ico" />

  <body>
    <header class="navbar">

        <ul class="logo">
          <li>

          <li>
            <a class="logo-btm" href="./index.html">yones</a>
          </li>
        </ul>

        <button
          class="hamburger"
          id="menu-button"
          aria-expanded="false"
          aria-controls="primary-navigation"
          aria-label="Toggle navigation"
        >
          <img src="./assets/hamburger.svg" alt="menu-icon" />
        </button>
      </div>

      <div class="menu-panel menu-hidden">
        <nav class="menu-mid">
          <a href="./index.html" class="links">Home </a>
          <a href="./pages/about.html" class="links">About</a>

          <a href="./pages/techstack.html" class="links">Tech Stack</a>

          <a href="./pages/projects.html" class="links">Projects</a>

          <a href="./pages/contact.html" class="links">Contact</a>
        </nav>

        <div class="menu-btm">
          <a
            href="https://github.com/yoneshussain"
            target="_blank"
            class="socialicons"
            ><img
              src="./assets/githubicon.png"
              style="height: 23px"
              alt="GitHub Profile"
              class="socials"
          /></a>

          <a href="https://x.com/login" target="_blank" class="socialicons"
            ><img
              src="./assets/twittericon.png"
              style="height: 23px"
              alt="Twitter Profile"
              class="socials"
          /></a>

          <a
            href="https://linkedin.com/in/yones-hussain-b9a265192"
            target="_blank"
            class="socialicons"
            ><img
              src="./assets/linkedinicon.png"
              style="height: 23px"
              alt="LinkedIn Profile"
              class="socials"
          /></a>
        </div>
      </div>

    <main class="home-info">

      </h1>

      <img
        src="./assets/yones-portrait.jpeg"
        class="portrait"
        alt="portrait of yones"
      />
    </main>

    <button
      class="theme-toggle theme-toggle-inactive"
      aria-label="Switch to dark mode"
    >
      <img src="./assets/theme.svg" alt="theme toggler icon" />
    </button>

    <footer class="footer">
      <p>
        Designed and Coded by <span class="footer-name">Yones</span> with
        <span class="footer-grad">Love</span> &
        <span class="footer-grad"> Coffee</span> 🌟

    </footer>

  <script src="./js/menu.js"></script>
